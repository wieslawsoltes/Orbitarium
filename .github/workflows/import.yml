name: Restore and validate complete Orbitarium delivery
on:
  push:
    branches: [main]
    paths: ['.orbitarium-import/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbitarium-delivery-import
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pending
        run: |
          if test -f .orbitarium-import/READY; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.ready == 'true'
        with:
          node-version: '22.14.0'
      - name: Restore source, reproducible distribution, scenarios, and all package archives
        if: steps.pending.outputs.ready == 'true'
        run: python3 .orbitarium-import/restore.py
      - name: Commit complete unpacked project without overwriting remote history
        if: steps.pending.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Orbitarium source, 12 packages, examples, distribution and test evidence'
          git push origin HEAD:main
      - uses: actions/setup-python@v5
        if: steps.pending.outputs.ready == 'true'
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        if: steps.pending.outputs.ready == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate real-origin browser interaction and persistence
        if: steps.pending.outputs.ready == 'true'
        run: |
          node scripts/serve.mjs > /tmp/orbitarium-server.log 2>&1 &
          for n in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python tests/browser_smoke.py --artifacts artifacts/github-validation
      - name: Refresh screenshot assets and record their provenance
        if: steps.pending.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, os
          root=Path('artifacts')
          fresh=root/'github-validation'
          for name in ['desktop','earth','mobile','mobile-inspector','mobile-library','scenario-library']:
              for target in [root,root/'publish-offline-validation']:
                  target.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(fresh/(name+'.png'),target/(name+'.png'))
          for alias,source in {'preview':'desktop','earth-close':'earth','mobile-preview':'mobile'}.items():
              shutil.copyfile(fresh/(source+'.png'),root/(alias+'.png'))
          report=json.loads((fresh/'browser-tests.json').read_text())
          (root/'SCREENSHOT-PROVENANCE.md').write_text('# Screenshot provenance\n\nPNG assets were refreshed by the actual Chromium interaction test on GitHub Actions. They replace the earlier local-render captures; pixel-identical preservation of those earlier PNGs is not claimed. The publish-offline-validation directory retains its historical JSON/log evidence, but its PNG files are refreshed aliases. See github-validation/browser-tests.json for the current run.\n\nRun: '+os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n')
          print(json.dumps({'passed':sum(r['status']=='passed' for r in report['results']),'failed':sum(r['status']=='failed' for r in report['results'])}))
          PY
          git add artifacts
          git commit -m 'Add fresh desktop and mobile browser captures and real-origin validation evidence'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.pending.outputs.ready == 'true'
        with:
          name: orbitarium-import-validation
          path: |
            artifacts/github-validation/
            artifacts/github-import-numerical.tap
            release/import-verification.json
